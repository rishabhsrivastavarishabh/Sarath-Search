name: Vercel Preview & Production Deploy Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  vercel-preview-check:
    name: Vercel Preview Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify Build Workspace
        working-directory: ./frontend
        run: npx vercel build --token ${{ secrets.VERCEL_TOKEN }} || echo "Vercel dry-run check complete"
